hostname R1
vrf definition BLUE
 rd 65101:100
 address-family ipv4
 exit-address-family
exit
interface GigabitEthernet1
 ip address 10.0.12.1 255.255.255.252
 no shutdown
exit
interface Loopback0
 ip address 10.255.1.1 255.255.255.255
exit
interface Tunnel100
 vrf forwarding BLUE
 ip address 172.16.100.1 255.255.255.252
 tunnel source Loopback0
 tunnel destination 10.255.3.3
exit
interface Loopback100
 vrf forwarding BLUE
 ip address 192.168.101.1 255.255.255.255
exit
router ospf 1
 router-id 10.255.1.1
 passive-interface Loopback0
 network 10.0.12.0 0.0.0.3 area 0
 network 10.255.1.1 0.0.0.0 area 0
exit
router bgp 65101
 bgp log-neighbor-changes
 address-family ipv4 vrf BLUE
  neighbor 172.16.100.2 remote-as 65103
  neighbor 172.16.100.2 activate
  network 192.168.101.1 mask 255.255.255.255
 exit-address-family
exit
