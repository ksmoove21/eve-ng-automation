servers:
  default:
    # Existing UNSC EVE-NG instance. The automation does not provision the
    # server or its network path; eve.unsc.in must already resolve and be
    # reachable from the machine running this CLI.
    url: http://eve.unsc.in
    username_env: EVE_USERNAME
    password_env: EVE_PASSWORD
    timeout: 120
    ssh_username_env: EVE_SSH_USERNAME
    ssh_password_env: EVE_SSH_PASSWORD
