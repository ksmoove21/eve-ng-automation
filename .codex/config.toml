[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"
interrupt_message = true

[agents.runner]
description = "Bounded execution runner for independent infrastructure or repository work while Root owns the sprint critical path."
config_file = "agents/runner.toml"

[agents.scribe]
description = "Low-cost sprint control tower and durable synchronization scribe for storyboard, handoffs, ownership, and Git-visible checkpoints."
config_file = "agents/scribe.toml"

[agents.hygiene]
description = "On-demand repository hygiene specialist for checkpoint cleanup, stale-state reconciliation, documentation organization, and low-risk maintenance."
config_file = "agents/hygiene.toml"
